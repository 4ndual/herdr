[package]
name = "tidus-bar-collector"
version = "0.1.0"
edition = "2021"
publish = false
description = "resolves the focused pane's orchestrator, its ancestry and its direct spawned children for the tidus subagent bar"

[[bin]]
name = "tidus-bar-collector"
path = "src/main.rs"

[dependencies]
tidus-bar-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
