id = "builtin.tidus-bar"
name = "Tidus Subagent Bar"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Bottom bar of agent chips: the focused orchestrator's ancestor chain pinned left, then its direct spawned children, each clickable to swap the terminal area to that agent (wasm render)"
# Linux only, honestly: the collector attributes the focused pane by reading
# /proc/<pid>/environ for HARNESS_NAME / CLAUDE_CONFIG_DIR. macOS has no /proc —
# it needs KERN_PROCARGS2 sysctl work before this can claim to run there, and
# claiming it early would ship a bar that is permanently empty.
platforms = ["linux"]

# Two artefacts, one nested workspace (see Cargo.toml): the wasm guest and the
# native collector. Both land under this plugin's own target dir, so linking
# this plugin never triggers a herdr build.
[[build]]
command = ["cargo", "build", "--target", "wasm32-unknown-unknown", "--release", "-p", "tidus-bar-ui"]

[[build]]
command = ["cargo", "build", "--release", "-p", "tidus-bar-collector"]

[[ui_modules]]
id = "tidus-bar"
title = "Tidus Subagent Bar"
description = "Lineage + direct children of the focused orchestrator, as clickable chips"
kind = "wasm"
api_version = 3
module = "target/wasm32-unknown-unknown/release/tidus_bar_ui.wasm"
hot_reload = "on"
surfaces = ["panel"]
# layout_read + focused_session: per-frame `frame` events carrying the injected
# HERDR_PLUGIN_UI_INPUT_JSON, and the focus identity the collector reads from
# HERDR_FOCUS_JSON.
# api_write: a chip click swaps the terminal area to that agent via `tab.focus`
# (and `tab.show {focus:true}` once children launch hidden). Both are in the
# bridge's WRITE_METHODS. Deliberately NOT api_input: this bar navigates, it
# never types into anyone's pane — the brief is explicit that any text delivery
# must go through `harness send`, never raw pane writes.
# toasts: chips with no PTY (a `light` child inside conductor, or a reaped one)
# report instead of navigating, and right-click reports everywhere.
capabilities = ["layout_read", "focused_session", "api_write", "toasts"]
ui_input_file = "tidus_bar_input.json"
# Run by App::tick_plugin_collectors on the dash tick. Relative argv[0] resolves
# against the plugin root (src/plugin_collector.rs::resolve_program).
#
# Deliberately NOT throttled: the bar describes the agent tree you are looking
# at right now, and a stale answer after a focus change is the one failure that
# would make it worse than nothing. It earns that by being cheap — one scan of
# ~/harnesses/*, a few /proc reads and three local socket calls, with the
# measured wall time written into every snapshot as `collect_us`.
collector = ["target/release/tidus-bar-collector"]

[ui_modules.placement]
# One full-width row carved from the BOTTOM edge of the pane area — the brief
# asks for a persistent bar under the typing box.
region = "bottom"
align = "start"
size = "1"
# min_peer is counted in ROWS for a top/bottom band (src/ui.rs: max_slot =
# height - min_peer). The schema default of 24 silently drops a one-row strip on
# any pane area 24 rows or shorter — that is what kept version-dash invisible.
min_peer = 5
# Below harness-indicator's 54: this bar is the tidus doorway and belongs
# closest to the panes it navigates between.
z = 53
