id = "builtin.usage-dash"
name = "Usage Dashboard"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Per-session token / context / rate-limit usage strip (wasm render)"
platforms = ["linux", "macos", "windows"]

# Build the guest module. Runs in this plugin dir, so the wasm lands at the
# module path below (honoring CARGO_TARGET_DIR when the environment sets one).
[[build]]
command = ["cargo", "build", "--target", "wasm32-unknown-unknown", "--release"]

[[ui_modules]]
id = "usage"
title = "Usage Dash"
kind = "wasm"
# v3: reads the generic HERDR_PLUGIN_UI_INPUT_JSON transport (spec §7.1) instead
# of the wave-0 host-specific HERDR_USAGE_RENDER_JSON env key. Toggle state stays
# host-owned via the existing usage_view/hits shim until items D/E relocate it.
api_version = 3
module = "target/wasm32-unknown-unknown/release/usage_dash_ui.wasm"
hot_reload = "on"
surfaces = ["usage_strip"]
# Frame events (per-tick render input + rect) are delivered only to modules that
# request LayoutRead or FocusedSession.
#
# mouse_all: the caption's version tokens reveal the latest version on HOVER,
#   and hover only reaches a module that requests MouseAll (src/ui_plugins.rs
#   gates `UiEvent::Mouse` on it). Clicks alone would arrive without it, via the
#   v3 hit-rect Action routing.
# plugin_actions: a confirmed click on an outdated version runs the update
#   actions declared below through HostEffect::InvokePluginAction.
capabilities = ["layout_read", "focused_session", "mouse_all", "plugin_actions"]
# The host reads this file from the module's HERDR_PLUGIN_STATE_DIR each frame
# (size-capped, mtime-cached) and injects it as HERDR_PLUGIN_UI_INPUT_JSON. The
# host writes it today (interim, relocating to a plugin collector in D/E); the
# generic machinery neither parses nor understands the contents.
ui_input_file = "usage_input.json"
# fork(wave-2): the host runs this out-of-process collector once per dashboard
# tick to produce the snapshot inside usage_input.json, so collection logic
# hot-reloads (rebuild the bin) with no host rebuild. argv[0] is resolved against
# plugin_root; the bin lands in the ROOT workspace target dir (this plugin is a
# nested wasm workspace, so ../../target escapes it to <repo>/target).
collector = ["../../target/release/usage-dash-collector"]

# ── CLI version actions ─────────────────────────────────────────────────────
# Invoked from the caption's version token. The update action RESTARTS the pane,
# which is why the guest requires a confirming second click before it emits it
# (see `handle_version_click` in src/lib.rs).
#
# Claude Code is typically a standalone native install rather than an npm package
# (`~/.local/share/claude/versions`), so the updater is the tool's own `update`
# subcommand — which re-checks against its real release channel rather than
# trusting the npm number the strip displays.

# The strip itself is a wasm guest plus a Rust collector and runs anywhere, so
# the PLUGIN stays on all three platforms; only these two shell actions are
# POSIX-only, and they are gated per action rather than by narrowing the plugin.
[[actions]]
id = "update-claude-code"
title = "Update Claude Code and resume this pane"
description = "Run `claude update`, then relaunch this pane's session with --resume"
platforms = ["linux", "macos"]
command = ["bash", "scripts/update-claude-code.sh"]

[[actions]]
id = "verify-cli-versions"
title = "Re-check CLI versions now"
description = "Force a fresh latest-version fetch, bypassing the 30-minute cache"
platforms = ["linux", "macos"]
command = ["bash", "scripts/verify-cli-versions.sh"]
