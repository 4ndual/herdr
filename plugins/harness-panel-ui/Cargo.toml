[package]
name = "harness-panel-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
herdr-ui-plugin-api = { path = "../../crates/herdr-ui-plugin-api", features = ["guest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
