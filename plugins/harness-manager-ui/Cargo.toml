[package]
name = "harness-manager-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
herdr-ui-plugin-api = { path = "../../crates/herdr-ui-plugin-api", features = ["guest"] }
harness-manager-model = { path = "../../crates/harness-manager-model" }
ratatui = { version = "0.30", default-features = false, features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
