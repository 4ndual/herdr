# ── widget module ─────────────────────────────────────────────────────────────
[[ui_modules]]
id = "archive-ui"
title = "Archive Dash"
description = "Compact chips of the 10 most-recent archived sessions; hover=résumé, left-click=restore, right-click=[fork][del]"
kind = "wasm"
api_version = 3
module = "target/wasm32-unknown-unknown/release/herdr_archive_dash_ui.wasm"
hot_reload = "on"
surfaces = ["panel"]
# The host reads this file from the module's HERDR_PLUGIN_STATE_DIR each frame
# (size-capped, mtime-cached) and injects it as HERDR_PLUGIN_UI_INPUT_JSON. Our
# archive/restore/delete scripts WRITE it (last-10, newest first); no collector
# and no host writer is involved (unlike usage-dash / goal-dash).
ui_input_file = "archive_input.json"
# mouse_all + NO declarative hit-rects: chips resolve clicks AND hover (for the
# résumé tooltip + the right-click [fork][del] menu) from the raw mouse stream.
# The host suppresses raw mouse (incl. hover Move) over declared hit-rects (F5
# dedupe), so hover REQUIRES the raw-mouse + no-hits pattern. api_read/api_write
# are held for future guest-side API use; today all mutations go through the
# slot-action scripts.
capabilities = ["layout_read", "toasts", "api_read", "api_write", "mouse_all"]

# Carve a slot on the LEFT (start) of the bottom band, leaving the usage dash at
# least 24 columns. button-dash carves the RIGHT (end) of the same band; the two
# panels don't overlap. "auto" would regrow the panel to the widest row each
# frame — but our detail rows (tooltip / menu) are kept NARROWER than the chip
# strip, so the strip is always the widest row and the panel width is stable on
# hover; we still pin a percentage so a long chip strip can't starve the band.
[ui_modules.placement]
region = "bottom_band"
align = "end"
size = "30%"
min_peer = 24
z = 50
