id = "builtin.archive-dash"
name = "Archive Dash"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Archive a pane's session and restore/fork/delete it from a compact chip widget (wasm render)"
platforms = ["linux", "macos", "windows"]

# Build the guest wasm module in this plugin dir; the wasm lands at the module
# path below (honoring CARGO_TARGET_DIR when the environment sets one).
[[build]]
command = ["cargo", "build", "--target", "wasm32-unknown-unknown", "--release"]

# ── archive ───────────────────────────────────────────────────────────────────
# Close the CURRENT (focused) pane and SAVE it into the archive store. Resolves
# the pane from HERDR_PANE_ID (falls back to the focused pane), reads its
# agent/session/cwd/workspace via `herdr pane get`, generates a short résumé,
# appends a JSON record to ~/.herdr-archive/archive.json, regenerates the
# widget's state-dir input file, THEN closes the pane's tab. Detached so it
# outlives the action runner (it closes the pane it was invoked from).
[[actions]]
id = "archive"
title = "Archive pane"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/archive-pane.sh\" >/dev/null 2>&1 &"]

# ── restore / fork / delete slot actions ──────────────────────────────────────
# Host plugin actions are param-less. The widget shows the 10 most-recent
# archived items as chips in a fixed slot order (slot 1 = newest). A click on the
# chip at slot N invokes the matching `<verb>-slot-N` action; the script sorts
# ~/.herdr-archive/archive.json by ts desc and selects the Nth record. This is
# the chosen mechanism for passing the "which entry" parameter without a guest
# filesystem or api_input (see scripts/archive-op.sh header for the rationale).
#   restore = resume the SAME session (no fork flag) in a new tab
#   fork    = resume with each agent's fork flag (fresh session id) in a new tab
#   delete  = drop the record from the store and regenerate the input file

[[actions]]
id = "restore-slot-1"
title = "Restore #1"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/archive-op.sh\" restore 1 >/dev/null 2>&1 &"]
