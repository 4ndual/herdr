id = "builtin.archive-dash"
name = "Archive Dash"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Archive a pane's session and restore/fork/delete it from a compact chip widget (wasm render)"
platforms = ["linux", "macos", "windows"]

# Build the guest wasm module in this plugin dir; the wasm lands at the module
# path below (honoring CARGO_TARGET_DIR when the environment sets one).
[[build]]
command = ["cargo", "build", "--target", "wasm32-unknown-unknown", "--release"]

# ── archive ───────────────────────────────────────────────────────────────────
# Close the CURRENT (focused) pane and SAVE it into the archive store. Resolves
# the pane from HERDR_PANE_ID (falls back to the focused pane), reads its
# agent/session/cwd/workspace via `herdr pane get`, generates a short résumé,
# appends a JSON record to ~/.herdr-archive/archive.json, regenerates the
# widget's state-dir input file, THEN closes the pane's tab. Detached so it
# outlives the action runner (it closes the pane it was invoked from).
[[actions]]
id = "archive"
title = "Archive pane"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/archive-pane.sh\" >/dev/null 2>&1 &"]

# ── restore / fork / delete ───────────────────────────────────────────────────
# THREE actions, not thirty. The widget passes WHICH record to act on as a
# payload: the guest emits `HostEffect::InvokePluginAction { payload_json }`
# (gated on the `plugin_actions` capability below) and the host exports that
# string to the script as HERDR_PLUGIN_PAYLOAD_JSON.
#
# This replaces the former `<verb>-slot-1..10` explosion, which existed because
# host actions were once param-less. Note the payload path is NOT the socket
# method `plugin.action.invoke` — that one still carries no payload; it is the
# guest-side HostEffect variant that does.
#
# The payload is `{"slot":N}`, 1-based, newest first — the same ordering the
# widget input file uses, so slot N here is chip N there. The script still
# re-derives the record by sorting the store by ts desc, so a stale chip can
# only ever act on the wrong record, never on a malformed one.
#   restore = resume the SAME session (no fork flag) in a new tab
#   fork    = resume with each agent's fork flag (fresh session id) in a new tab
#   delete  = drop the record from the store and regenerate the input file
[[actions]]
id = "restore"
title = "Restore archived session"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/archive-op.sh\" restore >/dev/null 2>&1 &"]
[[actions]]
id = "fork"
title = "Fork archived session"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/archive-op.sh\" fork >/dev/null 2>&1 &"]
[[actions]]
id = "delete"
title = "Delete archived session"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/archive-op.sh\" delete >/dev/null 2>&1 &"]


# ── widget module ─────────────────────────────────────────────────────────────
[[ui_modules]]
id = "archive-ui"
title = "Archive Dash"
description = "Compact chips of the 10 most-recent archived sessions; hover=résumé, left-click=restore, right-click=[fork][del]"
kind = "wasm"
api_version = 3
module = "target/wasm32-unknown-unknown/release/herdr_archive_dash_ui.wasm"
hot_reload = "on"
surfaces = ["panel"]
# The host reads this file from the module's HERDR_PLUGIN_STATE_DIR each frame
# (size-capped, mtime-cached) and injects it as HERDR_PLUGIN_UI_INPUT_JSON. Our
# archive/restore/delete scripts WRITE it (last-10, newest first); no collector
# and no host writer is involved (unlike usage-dash / goal-dash).
ui_input_file = "archive_input.json"
# mouse_all + NO declarative hit-rects: chips resolve clicks AND hover (for the
# résumé tooltip + the right-click [fork][del] menu) from the raw mouse stream.
# The host suppresses raw mouse (incl. hover Move) over declared hit-rects (F5
# dedupe), so hover REQUIRES the raw-mouse + no-hits pattern. api_read/api_write
# are held for future guest-side API use; today all mutations go through the
# restore/fork/delete scripts.
# plugin_actions: REQUIRED for the payload path — the host drops a guest's
# InvokePluginAction effect on the floor without it (ui_plugins.rs:1309-1311),
# which is what carries the slot number and lets three actions replace thirty.
capabilities = [
  "layout_read",
  "toasts",
  "api_read",
  "api_write",
  "mouse_all",
  "plugin_actions",
]

# Carve a slot on the LEFT (start) of the bottom band, leaving the usage dash at
# least 24 columns. button-dash carves the RIGHT (end) of the same band; the two
# panels don't overlap. "auto" would regrow the panel to the widest row each
# frame — but our detail rows (tooltip / menu) are kept NARROWER than the chip
# strip, so the strip is always the widest row and the panel width is stable on
# hover; we still pin a percentage so a long chip strip can't starve the band.
[ui_modules.placement]
region = "bottom_band"
align = "end"
size = "30%"
min_peer = 24
z = 50
