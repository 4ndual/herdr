id = "builtin.button-dash"
name = "Button Dash"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Clickable quick-reference of keyboard-shortcut actions in the bottom dash (wasm render)"
# Not windows: every action is a POSIX shell script run through `sh -lc`, and those
# scripts drive `ps`, `tmux` and `readlink /proc`. Advertising a platform the actions cannot run on
# just moves the failure from install time to click time.
platforms = ["linux", "macos"]

# Build the guest module in this plugin dir; the wasm lands at the module path
# below (honoring CARGO_TARGET_DIR when the environment sets one).
[[build]]
command = ["cargo", "build", "--target", "wasm32-unknown-unknown", "--release"]

# The swap picker's ratatui binary (see the `swap-here` action below). Separate
# crate, separate target dir: a wasm32 build and a host build cannot share one.
[[build]]
command = ["sh", "-lc", "cd tui-swap && cargo build --release"]

# restart-hr: fully kill & relaunch this herdr instance, restoring the session.
# The host runs actions with cwd = plugin_root and the server's full env inherited
# (HERDR_PLUGIN_ROOT + the server's own HERDR_SESSION / XDG_CONFIG_HOME, verified
# in src/app/api/plugins/runtime.rs — no env_clear). The script resolves WHICH
# instance to restart from that inherited HERDR_SESSION + XDG_CONFIG_HOME, so no
# instance arg is needed here. `nohup ... &` detaches it so it survives the
# server process it is about to kill (the script also self-detaches internally;
# macOS has no `setsid`, so we rely on nohup + the script's own re-exec). The
# script itself is owned by the restart-button agent at scripts/restart-herdr.sh.
[[actions]]
id = "restart-hr"
title = "Restart hr"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/restart-herdr.sh\" >/dev/null 2>&1 &"]

# full-restart: HARD restart — kill tmux + Claude Code + server (reclaim all RAM)
# and relaunch fresh, resuming the session. Same detach model as the soft button
# (nohup + the script's own guarded re-exec; macOS has no `setsid`). The script is
# owned by the full-restart agent at scripts/full-restart-herdr.sh and resolves
# WHICH instance from the inherited HERDR_SESSION + XDG_CONFIG_HOME.
[[actions]]
id = "full-restart"
title = "Full restart"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/full-restart-herdr.sh\" >/dev/null 2>&1 &"]

# handoff-hr: NON-DESTRUCTIVE server swap. Unlike restart-hr / full-restart, this
# does NOT kill anything: it asks the running server to transfer live pane PTY
# master fds (SCM_RIGHTS) to a replacement server spawned from the promoted binary,
# so agent panes keep the SAME pids and every in-flight subagent survives.
# Use after `mv`-ing a freshly E2E'd binary into place. On ANY failure it toasts and
# changes nothing — it deliberately never falls back to a kill, because not killing
# the agents is the entire point of the button. Same detach model as the restart
# siblings (nohup + the script's own guarded re-exec; macOS has no `setsid`),
# because the server that spawned the action is the one being replaced. The script
# resolves WHICH instance from the inherited HERDR_SESSION + XDG_CONFIG_HOME, so no
# instance arg is needed here, and pins HERDR_SOCKET_PATH to that instance's SESSION
# socket — the bare CLI defaults to the GLOBAL socket, which is a different server.
[[actions]]
id = "handoff-hr"
title = "Handoff hr"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/handoff-herdr.sh\" >/dev/null 2>&1 &"]

# fork: fork the CURRENT pane's agent conversation into a NEW TAB (current
# workspace), by reusing herdr's own resume convention + each agent's fork flag:
#   claude -> claude --resume <id> --fork-session
#   codex  -> codex fork <id>
#   pi     -> pi --fork <id>
#   jcode  -> REFUSED with a toast; jcode has no fork flag, and resuming the same
#             session in a second pane is two writers on one conversation, not a
#             branch. The single source of truth is `agent_launch_cmd` in
#             scripts/dash-common.sh, shared with the archive dash.
# The script reads the source pane from the inherited HERDR_PANE_ID and resolves
# the agent/session/cwd live via `herdr pane get`; from the TAB menu that env var
# is absent by design, so it falls back to the focused pane. Detached so it
# outlives the action runner (socket work only; nothing is killed).
[[actions]]
id = "fork"
title = "Fork → tab"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/fork-conversation.sh\" tab >/dev/null 2>&1 &"]

# fork-workspace: same fork, but into a NEW WORKSPACE instead of a new tab.
[[actions]]
id = "fork-workspace"
title = "Fork → workspace"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/fork-conversation.sh\" workspace >/dev/null 2>&1 &"]

# resume-search: open the resume-search picker as an in-app overlay; on
# Enter/click it execs the resumed session into a pane.
#
# The picker itself lives at plugins/resume-picker/ (bun; scans claude, codex, pi
# and every ~/harnesses/<n>/config root, and emits an env-prefixed skip-mode
# resume command). This script only resolves its wrapper path and hands it to
# `herdr resume-picker open --wrapper`. Resolution is configuration-free
# ($HERDR_PLUGIN_ROOT-relative, then this script's own dir, then PATH) with
# $HERDR_RESUME_PICKER_WRAPPER as the override; when it is missing the button
# toasts that plainly instead of failing silently. Detached so it outlives the
# action runner.
[[actions]]
id = "resume-search"
title = "Resume search"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/open-resume-picker.sh\" >/dev/null 2>&1 &"]

# relaunch-skip: relaunch the CURRENT pane's session IN PLACE in skip/yolo
# permission mode (claude --dangerously-skip-permissions / codex
# --dangerously-bypass-approvals-and-sandbox; pi and jcode have no verified
# equivalent and get a toast). Nothing is forked and no tab appears: the script
# spawns the resumed session as a sibling pane in the SAME tab via `agent start
# --tab --split` and then closes the old pane — in that order, because closing
# first would take a single-pane tab with it. A harness-owned session is handed
# its CLAUDE_CONFIG_DIR / CODEX_HOME through `--env`. See
# scripts/relaunch-skip.sh. Detached so it outlives the action runner.
[[actions]]
id = "relaunch-skip"
title = "Relaunch skip"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/relaunch-skip.sh\" >/dev/null 2>&1 &"]

# reference-list: the full button reference, as a floating OVERLAY pane.
#
# It used to expand inside the bottom-band panel, where ~4 slack rows had to hold
# 11 entries — 7 were clipped off-screen with no scroll affordance (defect D4).
# Per the UX canon, a list that does not fit the band is a secondary surface and
# a secondary surface is an overlay: Esc closes it, it needs no cleanup, and it
# can be as tall as it likes. The strip's `[?]` cell invokes this action.
#
# `plugin pane open` is called directly rather than through a wrapper script —
# there is nothing to resolve, unlike the resume picker's wrapper hunt.
#
# NO --target-pane: the host rejects it for an overlay ("overlay and popup plugin
# panes target the active pane"), because an overlay always follows the ACTIVE
# pane. That is also the explanation for the overlay that once appeared in a
# workspace nobody was looking at — it was invoked over the socket while another
# workspace was active, not from a click. Clicked from the strip, the active pane
# is by definition the one on screen.
[[actions]]
id = "reference-list"
title = "Button reference"
contexts = ["tab", "pane"]
command = [
  "sh",
  "-lc",
  "nohup \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin builtin.button-dash --entrypoint reference --placement overlay --focus >/dev/null 2>&1 &",
]

# The overlay's own surface: a bun TUI reading reference.json (the same data the
# wasm guest renders in the strip; a guest test fails if the two drift).
[[panes]]
id = "reference"
title = "button reference"
description = "Every button in the dash with its shortcut and what it does"
# No width/height here: the host only accepts a size on a "popup" pane
# (manifest.rs invalid_plugin_pane_size), and an overlay is sized by the host.
placement = "overlay"
command = ["sh", "-lc", "exec bun run \"$HERDR_PLUGIN_ROOT/scripts/reference-overlay.ts\""]

# remote: CLAUDE ONLY. Enable Claude Code Remote Control on the CURRENT pane's
# LIVE conversation so it can be continued from the phone / claude.ai. For a
# claude pane it types the `/remote-control` slash command into the running
# agent; codex, pi and jcode panes get one plain toast saying so, because Remote
# Control is a Claude Code feature with no equivalent elsewhere — a claude
# orchestrator can still call those agents locally. See scripts/remote-control.sh.
# Detached so it outlives the action runner.
[[actions]]
id = "remote"
title = "Remote"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/remote-control.sh\" >/dev/null 2>&1 &"]

# bg-dispatch: CLAUDE ONLY (a `--bg` primitive exists nowhere else), and
# deliberately independent of the source pane's agent — only its cwd is
# inherited, so you can dispatch a background agent from a codex or pi pane.
# Dispatches a Claude Code BACKGROUND agent (`claude --bg "<prompt>"`,
# detached; manage with `claude agents`). `--bg` REQUIRES a prompt and a herdr
# button cannot take typed input (UiEvent::Key does not reach panel modules), so
# the button opens a NEW TAB whose root pane runs scripts/bg-prompt.sh — the
# terminal collects the prompt, dispatches it, and then stays alive so the
# dispatched agent's id remains visible (see scripts/bg-dispatch.sh). Detached
# like the siblings: socket work only, nothing is killed.
[[actions]]
id = "bg-dispatch"
title = "Background agent"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/bg-dispatch.sh\" >/dev/null 2>&1 &"]

# relocate: CLAUDE ONLY — it rewrites a Claude Code transcript slug, and codex /
# pi / jcode store sessions differently; those panes get a toast. Move the
# CURRENT pane's conversation to the project it is
# actually about. Claude Code has no mid-session `cd`, so this drives the
# `relocate` skill's migrate-session.sh (transcript + subagents copied into the
# target dir's slug) and then resumes there via `claude --resume`. The destination is
# INFERRED from the transcript — ranked by distinct files touched per git repo —
# but never auto-picked: the script opens a tab listing the candidates and the
# user chooses (see scripts/relocate-conversation.sh). Detached like the
# siblings: socket work only, and the source session is copied, never destroyed.
[[actions]]
id = "relocate"
title = "Relocate"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/relocate-conversation.sh\" >/dev/null 2>&1 &"]

[[ui_modules]]
id = "button-ui"
title = "Button Dash"
description = "Data-driven clickable shortcut buttons rendered in the bottom-dash slot beside the usage strip"
kind = "wasm"
api_version = 3
module = "target/wasm32-unknown-unknown/release/herdr_button_dash_ui.wasm"
hot_reload = "on"
# Generic, data-driven placement: render in a slot carved from the usage band
# (its own rect + hit-rects), never stacked on the usage_strip surface. WHERE it
# renders is pure manifest DATA now — edit the `[ui_modules.placement]` table
# below and the panel moves/resizes on the next tick with NO host rebuild.
surfaces = ["panel"]
# mouse_all: the buttons resolve clicks AND hover (for the emoji tooltip) from
# the raw mouse stream instead of declarative hit-rects — the host suppresses raw
# mouse (incl. hover Move) over a module's own hit-rects (F5 dedupe), so hover
# tooltips REQUIRE the raw path. This keeps the whole feature a guest hot-reload.
capabilities = ["layout_read", "toasts", "api_read", "api_write", "mouse_all"]

# Placement spec (see .local/prd/generic-plugin-panel-placement.md):
#   region   = bottom_band | left | right | top | bottom | free
#   align    = start | center | end   (side within bottom_band / anchor for free)
#   size     = "auto" | "<cells>" | "<pct>%"   (extent along the carved axis)
#   min_peer = cells the peer region always keeps (so the usage dash stays usable)
# This reproduces the old BottomDash result exactly: a snug slot on the RIGHT of
# the usage band, leaving the usage dash at least 24 columns.
[ui_modules.placement]
# Fixed width (not "auto"): the compact GRID wraps 4 buttons per row, so a fixed
# slot means the panel NEVER resizes when a hover tooltip / expanded list appears
# and the buttons can't shift horizontally under the cursor (the tooltip rows are
# kept narrower than the strip — see detail_spans). "auto" regrew the panel to the
# widest row each frame, which moved the buttons under the cursor.
#
# 42 = the widest rendered grid row for the current 10 buttons + toggle. It is
# NOT a free-hand number: the guest computes the same value in widest_grid_row()
# and the `manifest_panel_size_matches_grid` test reads this key and fails with
# the correct replacement when they disagree. Too small clips the strip; too
# large silently steals columns from the usage dash sharing this band (it kept
# 45 for a while after four buttons were deleted). Run `cargo test` after adding
# or removing a button and use the number it prints.
region = "bottom_band"
align = "end"
size = "42"
min_peer = 24
z = 60

# swap-here: the "resume this session anywhere" PICKER.
#
# It replaces the old `codex-here` button, which was this same swap with both
# ends nailed down (codex, and whichever harness owned the pane). Codex is now
# one row in the picker.
#
# Two halves, the split the agent launcher established: an OVERLAY pane running
# a native ratatui form (tui-swap/), and one command that does the work. The
# overlay owns the keyboard, and it resolves the SOURCE pane from
# HERDR_PLUGIN_CONTEXT_JSON — the host captures that before the overlay takes
# focus, so it sees the pane the user was looking at, not itself.
#
# The picker holds NO swap logic: both its `plan:` preview (`--dry-run`, which
# writes nothing) and its Enter come from `harness swap-here`
# (harness-fleet/go/swaphere.go). One algorithm, so a preview can never
# describe a different swap than the one that runs.
[[actions]]
id = "swap-here"
title = "Swap here"
contexts = ["tab", "pane"]
command = ["sh", "-lc", "nohup \"$HERDR_PLUGIN_ROOT/scripts/swap-here.sh\" >/dev/null 2>&1 &"]

# The picker's surface. Overlay, not popup: a list whose length is the size of
# the fleet is a secondary surface, and it gets Esc-to-close for free. The host
# sizes an overlay, so no width/height here (manifest.rs rejects a size on
# anything but a "popup").
[[panes]]
id = "swap"
title = "resume this session anywhere"
description = "Pick a runtime, mode and harness; reopens this pane's session there, in place"
placement = "overlay"
command = ["sh", "-lc", "exec \"$HERDR_PLUGIN_ROOT/tui-swap/target/release/swap-here-tui\""]

