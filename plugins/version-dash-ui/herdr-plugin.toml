id = "builtin.version-dash"
name = "Version Dash"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "At-a-glance running herdr versions (hr + herdrtest) vs latest stable release, with right-click staged updates (wasm render)"
# Not windows: the collector resolves instances through `/proc` (and `lsof`/`ps` on macOS)
# and the update scripts drive `tmux`. Advertising a platform the actions cannot run on
# just moves the failure from install time to click time.
platforms = ["linux", "macos"]

# Build the guest module in this plugin dir; the wasm lands at the module path
# below (honoring CARGO_TARGET_DIR when the environment sets one).
[[build]]
command = ["cargo", "build", "--target", "wasm32-unknown-unknown", "--release"]

[[ui_modules]]
id = "version"
title = "Version Dash"
description = "Compact hr + herdrtest running-vs-latest herdr version indicator, one full-width line"
kind = "wasm"
api_version = 3
module = "target/wasm32-unknown-unknown/release/version_dash_ui.wasm"
hot_reload = "on"
# Generic data-driven placement (region/align/size/min_peer/z). WHERE it renders
# is pure manifest DATA — edit the placement table and it moves with no host
# rebuild.
surfaces = ["panel"]
# layout_read + focused_session: needed to receive per-frame `frame` events
# (which carry the injected HERDR_PLUGIN_UI_INPUT_JSON). toasts: left-click shows
# an instance's detail as a toast. plugin_actions: right-click invokes the staged
# update actions declared below (InvokePluginAction → plugin.action.invoke).
# mouse_all: hover is the canon trigger for detail, and the host only delivers
# raw Move events to a module that declares no hit-rects of its own (the F5
# click-dedupe). toasts stays for the promotion refusals, which are outcomes.
capabilities = [
  "layout_read",
  "focused_session",
  "toasts",
  "plugin_actions",
  "mouse_all",
]
# The host reads this file from the module's HERDR_PLUGIN_STATE_DIR each frame
# (size-capped, mtime-cached) and injects it as HERDR_PLUGIN_UI_INPUT_JSON. The
# out-of-process `version-dash-collector` below writes it.
#
# The `collector` field used to run for builtin.usage-dash ONLY — every other
# plugin declaring it was parsed, echoed by `plugin list`, and never executed.
# That is why this plugin shipped a scheduled user job instead, and why the
# strip rendered nothing on any machine where that job was never installed
# (which was every machine). `App::tick_plugin_collectors` now launches the
# declared collector of EVERY enabled module that also declares a
# `ui_input_file`, so the snapshot is produced by the host tick, in the right
# instance's state dir, with no external scheduling. scripts/install-collector-agent.sh
# remains only for hosts too old to have the generic tick.
#
# v1 +N caveat: the `+N` local-changes count is git-source-derived
# (`git rev-list --count v<latest>..HEAD` on the fork checkout), so it reflects
# the SOURCE HEAD, not the exact build each binary was compiled from. Both
# instances therefore share the same count until a version bump. Build-baked
# per-binary accuracy is a later host-code follow-up.
ui_input_file = "version_input.json"
# Relative argv[0] resolves against the plugin root (src/plugin_collector.rs
# ::resolve_program), so this points at the root workspace build of the
# collector crate in plugins/version-dash-ui/collector — the same shape
# usage-dash uses.
collector = ["../../target/release/version-dash-collector"]

[ui_modules.placement]
# A single full-width line carved from the BOTTOM edge of the pane area. This
# replaces the V1 `bottom_band` placement, which took the whole 7-row usage band
# height and broke the layout. `size = "1"` ⇒ exactly one row; the strip renders
# LEFT-compact so the detached-sessions plugin can cohabit the row to its right.
region = "bottom"
align = "start"
size = "1"
# min_peer is counted in ROWS for a top/bottom band (src/ui.rs: max_slot =
# height - min_peer). The schema default is 24, which silently drops this
# one-row strip on any pane area 24 rows or shorter — a short pane, a
# horizontally split tab, a small window. Five rows is the smallest peer that
# still leaves a usable pane.
min_peer = 5
z = 55

# ── the two-button update pipeline (right-click on an instance token) ──────
#
# Button 1 (test) installs the fork tip into herdrtest and PROVES it in the
# running process. Button 2 (hr) promotes that exact, proven build into hr.
# Button 2 is inert until button 1 has written a passing, sha-bound receipt —
# enforced twice: the guest greys the token out, and update-hr.sh refuses on its
# own even if it is invoked directly.
#
# Actions run from the plugin root with HERDR_* env set (HERDR_BIN_PATH,
# HERDR_PLUGIN_ID, HERDR_PLUGIN_STATE_DIR, …). HERDR_PLUGIN_STATE_DIR is what
# makes the scripts act on the instance the user actually clicked in.
#
# NEITHER ACTION RESTARTS hr. Button 2 ends in `awaiting_restart` and waits for
# ⌃⌥X. There is no flag, env var, or error path that changes that.
[[actions]]
id = "update-herdrtest-from-latest"
title = "Update herdrtest and verify it"
description = "Install the fork tip into herdrtest, restart it, and prove the plugin bridge and every plugin actually loaded"
command = ["bash", "scripts/update-herdrtest.sh"]

[[actions]]
id = "update-hr-from-herdrtest"
title = "Update hr from the verified herdrtest build"
description = "Promote the EXACT build herdrtest was verified on into hr, then wait for you to restart with ⌃⌥X"
command = ["bash", "scripts/update-hr.sh"]

[[actions]]
id = "show-latest-notes"
title = "Show release notes for the latest version"
description = "Open the cached patch notes for the newest release in a pane (offline — no network at click time)"
command = ["bash", "scripts/show-latest-notes.sh"]
