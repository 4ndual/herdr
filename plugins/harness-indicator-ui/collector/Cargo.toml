[package]
name = "harness-indicator-collector"
version = "0.1.0"
edition = "2021"
publish = false
description = "resolves the focused pane's fleet harness, agent and folders for the harness-indicator strip"

[[bin]]
name = "harness-indicator-collector"
path = "src/main.rs"

[dependencies]
harness-indicator-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
