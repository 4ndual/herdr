[package]
name = "harness-indicator-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Nested workspace: guest + model + collector build here, independently of the
# host binary's workspace, so linking this plugin never drags in a herdr build.
# The collector is a member (not a separate workspace) so one `cargo build` in
# this directory produces both artefacts the manifest points at.
[workspace]
members = ["model", "collector"]

[dependencies]
herdr-ui-plugin-api = { path = "../../crates/herdr-ui-plugin-api", features = ["guest"] }
harness-indicator-model = { path = "model" }
ratatui = { version = "0.30", default-features = false, features = ["unstable-rendered-line-info"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
