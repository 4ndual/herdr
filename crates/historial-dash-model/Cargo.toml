[package]
name = "historial-dash-model"
version = "0.1.0"
edition = "2021"
description = "wasm-safe serde data model for the historial (pane-close history) dashboard (no I/O, no ratatui, no chrono)"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
