id = "example.smoke"
name = "Smoke Plugin"
version = "0.1.0"
min_herdr_version = "0.6.10"
description = "Portable plugin smoke fixture"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "workspace-list"
title = "List workspaces"
contexts = ["workspace"]
command = ["herdr", "workspace", "list"]

[[events]]
on = "worktree.created"
command = ["herdr", "plugin", "log", "list", "--plugin", "example.smoke"]

[[panes]]
id = "board"
title = "Board"
placement = "overlay"
command = ["herdr", "workspace", "list"]

[[ui_modules]]
id = "goal-ui"
title = "Goal UI"
kind = "wasm"
api_version = 1
module = "dist/goal-ui.wasm"
hot_reload = "on"
surfaces = ["header", "footer", "tab_bar", "right_panel", "overlay", "context_menu"]
capabilities = ["focused_session", "mouse_all", "context_menu_augment", "clipboard_write", "pane_input", "headless_actions"]
