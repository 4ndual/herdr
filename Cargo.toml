[package]
name = "herdr"
version = "0.8.2"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
homepage = "https://herdr.dev"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/sounds/*",
    "docs/next/api/herdr-api.schema.json",
    "skills/herdr/SKILL.md",
    "website/install.ps1",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }
clap_complete = "4.5"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
goal-dash-core = { path = "crates/goal-dash-core" }
goal-dash-model = { path = "crates/goal-dash-model" }
herdr-ui-plugin-api = { path = "crates/herdr-ui-plugin-api", features = ["schema"] }
harness-manager-model = { path = "crates/harness-manager-model" }
historial-dash-model = { path = "crates/historial-dash-model" }
interprocess = "2.4.2"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "0.2"
portable-pty = "=0.9.0"
png = "0.17"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
usage-dash-core = { path = "crates/usage-dash-core" }
wasmtime = "32.0.0"
schemars = { version = "1.2.1", features = ["derive"] }

[features]
# fork: the host image renderer (`src/host_image.rs` — the `~/.claude/image-cache`
# reader, Claude `[Image #N]` placeholder resolution, and the half-block mosaic
# fallback) is compiled OUT by default on this fork. It is a feature rather than a
# deletion so an upstream merge that touches image code still applies cleanly:
# turning it back on is `--features host-images`, not a revert.
#
# NOTE: this gates `host_image` ONLY. `kitty_graphics` stays compiled in — 0.7.5
# added the pane-graphics socket API on top of `kitty_graphics::HostCellSize`
# (`src/api/server/pane_graphics_stream.rs`, `src/app/api/pane_graphics.rs`), so
# removing it would break upstream API surface, not just images.
default = []
host-images = []

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[target.'cfg(windows)'.dependencies]
# UTF-16 SDDL input for interprocess security descriptors.
widestring = "1.2"
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
wat = "1"

[workspace]
members = ["crates/usage-dash-model", "crates/usage-dash-core", "crates/goal-dash-model", "crates/goal-dash-core", "crates/herdr-ui-plugin-api", "crates/historial-dash-model", "crates/harness-manager-model", "crates/version-dash-model", "plugins/usage-dash-ui/collector", "plugins/version-dash-ui/collector", "plugins/claude-image-preview/collector", "plugins/image-view-ui/collector"]
resolver = "2"
